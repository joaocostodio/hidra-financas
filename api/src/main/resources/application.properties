# API na porta 8090 (a 8080 fica livre para o banco-hidra / projeto da aula)
quarkus.http.port=8090
quarkus.http.test-port=8091

# Banco de dados: PostgreSQL do docker-compose (docker compose up -d, na raiz do projeto)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/financeiro
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/financeiro
%dev.quarkus.datasource.devservices.enabled=false
# Nos testes não há URL: o Quarkus sobe um Postgres descartável sozinho (via Docker)
# Na nuvem (Render + Neon) o banco vem da variável DATABASE_URL (ver config/BancoDaNuvem.java).
# O Neon desliga o banco depois de 5 min parado: conexões ociosas são descartadas antes disso.
%prod.quarkus.datasource.jdbc.min-size=0
%prod.quarkus.datasource.jdbc.max-size=5
%prod.quarkus.datasource.jdbc.idle-removal-interval=PT2M
%prod.quarkus.datasource.jdbc.max-lifetime=PT4M

# O Hibernate cria/atualiza as tabelas a partir das entidades
quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false

# ---------- Login com JWT ----------
# Em dev e nos testes o Quarkus gera sozinho o par de chaves RSA que assina o token.
# Em produção as chaves vêm de variáveis de ambiente (o conteúdo da chave em Base64, sem as linhas BEGIN/END),
# para nunca ficarem no Git. Ver docs/hospedagem-render.md.
%prod.smallrye.jwt.sign.key=${JWT_CHAVE_PRIVADA}
%prod.mp.jwt.verify.publickey=${JWT_CHAVE_PUBLICA}
mp.jwt.verify.issuer=hidra-financas
smallrye.jwt.new-token.issuer=hidra-financas
# Validade do token: 1 hora
smallrye.jwt.new-token.lifespan=3600
# O token vem no cookie httpOnly "financas_sessao" (o JavaScript do site não o lê), e não no cabeçalho Authorization.
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=financas_sessao

# O site chama a API pelo próprio endereço (/api), e o ng serve repassa para cá (web/proxy.conf.json).
# Por isso não precisa de CORS, e a API só escuta no próprio PC.
%dev.quarkus.http.host=127.0.0.1

# ---------- Produção (um container só: a API também entrega o site) ----------
# As rotas REST ficam em /api (o site tem telas com os mesmos nomes, como /transacoes).
# Em dev e nos testes continuam na raiz, porque lá quem tira o "/api" é o proxy do ng serve.
%prod.quarkus.rest.path=/api
# O Render diz em que porta escutar pela variável PORT
%prod.quarkus.http.port=${PORT:8090}
