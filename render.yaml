# Blueprint do Render: cria o serviço sozinho a partir deste repositório (Dashboard → New → Blueprint).
# Passo a passo: docs/hospedagem-render.md
services:
  - type: web
    name: hidra-financas
    runtime: docker
    plan: free
    # Virgínia (EUA): a região do Render mais perto do Brasil. Crie o banco do Neon em "AWS US East 1 (N. Virginia)".
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Valor secreto: o Render pede na criação e guarda só no painel (nunca no Git).
      # As chaves do JWT não precisam ser informadas: a API gera e guarda no banco (config/ChavesDaNuvem.java).
      - key: DATABASE_URL
        sync: false
