<h2 mat-dialog-title>{{ conta ? 'Detalhes da conta' : 'Nova conta' }}</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <mat-dialog-content>
    @if (erro()) {
      <div class="erro-geral" role="alert"><mat-icon>error</mat-icon> {{ erro() }}</div>
    }

    @if (conta) {
      <div class="saldo-atual">
        <span class="muted">Saldo atual</span>
        <b class="num" [class.negativo]="conta.saldo < 0">{{ conta.saldo | currency }}</b>
      </div>
    }

    <mat-form-field>
      <mat-label>Descrição</mat-label>
      <input matInput formControlName="descricao" placeholder="Ex.: Nubank, Carteira, Poupança" cdkFocusInitial />
      <mat-error>Informe a descrição</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Saldo inicial</mat-label>
      <span matTextPrefix>R$&nbsp;</span>
      <input matInput type="number" step="0.01" formControlName="saldoInicial" />
      <mat-hint>Quanto já tinha nessa conta ao começar a usar o sistema</mat-hint>
      <mat-error>Informe o saldo inicial (pode ser 0)</mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions>
    @if (conta) {
      <button matButton type="button" class="perigo" (click)="excluir()"><mat-icon>delete</mat-icon>Excluir</button>
    }
    <span class="espaco"></span>
    <button matButton type="button" mat-dialog-close>Cancelar</button>
    <button matButton="filled" type="submit" [disabled]="salvando()">Salvar</button>
  </mat-dialog-actions>
</form>
